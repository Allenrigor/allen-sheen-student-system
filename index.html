<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Student Records System</title>

  <!-- jQuery -->
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

  <!-- Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
</head>
<body>
  <main>
    <h1>Student Records System</h1>
    <p>Class demonstration. Fictional records only.</p>

    <form id="login">
      <h2>Operator sign in</h2>
      <label>Email <input id="email" type="email" required /></label>
      <label>Password <input id="password" type="password" required /></label>
      <button>Sign in</button>
      <button id="register" type="button">Register</button>
    </form>

    <p id="auth-message" role="status"></p>
    <section id="app" hidden>
      <!-- Main app content will show after login -->
      <h2>Welcome!</h2>
      <p>Student records will appear here.</p>
      <button id="signout">Sign Out</button>
    </section>
  </main>

  <script>
    // --------------------------
    // UPDATE THESE WITH YOUR REAL KEYS!
    // --------------------------
    const SUPABASE_URL = "YOUR_PROJECT_URL_HERE";
    const SUPABASE_ANON_KEY = "YOUR_PUBLIC_ANON_KEY_HERE";

    // Initialize Supabase
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // Helper: Show messages
    function showMessage(text) {
      $('#auth-message').text(text);
    }

    // Login
    $('#login').on('submit', async function (e) {
      e.preventDefault();
      const email = $('#email').val();
      const password = $('#password').val();

      showMessage('Signing in...');
      
      const { data, error } = await supabase.auth.signInWithPassword({ email, password });
      
      if (error) {
        showMessage('Error: ' + error.message);
      } else {
        showMessage('Signed in successfully!');
        $('#login').hide();
        $('#app').show();
      }
    });

    // Register
    $('#register').on('click', async function () {
      const email = $('#email').val();
      const password = $('#password').val();

      if (!email || !password) {
        showMessage('Please enter email and password first.');
        return;
      }

      showMessage('Creating account...');
      
      const { data, error } = await supabase.auth.signUp({ email, password });
      
      if (error) {
        showMessage('Error: ' + error.message);
      } else {
        showMessage('Account created! Check your email to confirm, then sign in.');
      }
    });

    // Sign Out
    $('#signout').on('click', async function () {
      await supabase.auth.signOut();
      $('#login').show();
      $('#app').hide();
      showMessage('Signed out.');
    });
  </script>
</body>
</html>
