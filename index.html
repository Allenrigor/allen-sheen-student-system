<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Student Records System</title>
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
</head>
<body>
  <main>
    <h1>Student Records System</h1>
    <p>Class demonstration. Fictional records only.</p>

    <form id="login">
      <h2>Operator sign in</h2>
      <label>Email <input id="email" type="email" required /></label>
      <label>Password <input id="password" type="password" required /></label>
      <button type="submit">Sign in</button>
      <button id="register" type="button">Register</button>
    </form>

    <p id="auth-message" role="status"></p>

    <section id="app" hidden>
      <h2>Welcome!</h2>
      <p>Student records will appear here.</p>
      <button id="signout">Sign Out</button>
    </section>
  </main>

  <script>
    const SUPABASE_URL = "https://YOUR-PROJECT.supabase.co";
    const SUPABASE_ANON_KEY = "YOUR_ANON_KEY_HERE";

    // ↓↓↓ THIS LINE MUST APPEAR EXACTLY ONCE ↓↓↓
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    function showMessage(text) {
      document.getElementById('auth-message').textContent = text;
    }

    document.getElementById('login').addEventListener('submit', async function (e) {
      e.preventDefault();
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      showMessage('Signing in...');
      const { data, error } = await supabase.auth.signInWithPassword({ email, password });
      if (error) showMessage('❌ ' + error.message);
      else {
        showMessage('✅ Signed in!');
        document.getElementById('login').style.display = 'none';
        document.getElementById('app').hidden = false;
      }
    });

    document.getElementById('register').addEventListener('click', async function () {
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      if (!email || !password) { showMessage('⚠️ Enter email & password first.'); return; }
      showMessage('Creating account...');
      const { data, error } = await supabase.auth.signUp({ email, password });
      if (error) showMessage('❌ ' + error.message);
      else showMessage('✅ Account created! You can now sign in.');
    });

    document.getElementById('signout').addEventListener('click', async function () {
      await supabase.auth.signOut();
      document.getElementById('login').style.display = 'block';
      document.getElementById('app').hidden = true;
      showMessage('👋 Signed out.');
    });
  </script>
</body>
</html>
