<script>
  // --------------------------
  // UPDATE THESE WITH YOUR REAL KEYS!
  // --------------------------
  const SUPABASE_URL = https://kqhfrlrfdzamcjzqooce.supabase.co
  const SUPABASE_ANON_KEY = sb_publishable_2SYRWK1a3RGLs0Oq6x_eZg_lFRbz2Yn

  // Initialize Supabase
  const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  // Helper: Show messages
  function showMessage(text) {
    let msg = document.getElementById('auth-message');
    if (!msg) {
      msg = document.createElement('p');
      msg.id = 'auth-message';
      msg.setAttribute('role', 'status');
      document.querySelector('form').after(msg);
    }
    msg.textContent = text;
  }

  // Login
  document.querySelector('#login').addEventListener('submit', async function (e) {
    e.preventDefault();
    const email = document.getElementById('email').value;
    const password = document.getElementById('password').value;

    showMessage('Signing in...');
    
    const { data, error } = await supabase.auth.signInWithPassword({ email, password });
    
    if (error) {
      showMessage('Error: ' + error.message);
    } else {
      showMessage('Signed in successfully!');
      document.querySelector('form').style.display = 'none';
      document.getElementById('app').hidden = false;
    }
  });

  // Register
  document.querySelector('#register').addEventListener('click', async function () {
    const email = document.getElementById('email').value;
    const password = document.getElementById('password').value;

    if (!email || !password) {
      showMessage('Please enter email and password first.');
      return;
    }

    showMessage('Creating account...');
    
    const { data, error } = await supabase.auth.signUp({ email, password });
    
    if (error) {
      showMessage('Error: ' + error.message);
    } else {
      showMessage('Account created! Check your email to confirm, then sign in.');
    }
  });
</script>
